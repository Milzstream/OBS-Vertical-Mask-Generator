name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout 🛎️
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4

      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            version="$(jq -r '.version' buildspec.json)"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'validTag=false' >> "$GITHUB_OUTPUT"
              echo "Version '${version}' is not a release tag."
              exit 0
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null 2>&1; then
              echo 'validTag=false' >> "$GITHUB_OUTPUT"
              echo "Tag ${version} already exists."
              exit 0
            fi
            git tag "${version}"
            git push origin "refs/tags/${version}"
            echo 'validTag=true' >> "$GITHUB_OUTPUT"
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"

          for candidate in */*.zip */*.exe; do
            mv "${candidate}" "${root_dir}/$(basename "${candidate}")"
          done

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          {
            echo "HUD Mask ${{ steps.check.outputs.version }} for OBS Studio on Windows."
            echo
            echo "Add **HUD Mask**, pick a source, draw a rough highlight, clean it up, and place the cut-out. Auto-hide is optional and experimental."
            echo
            echo "Requires OBS Studio 33 or newer. OBS 32 will not load this build. Close OBS before installing."
            echo
            echo "The plugin DLL sits next to the \`data\` folder. The installer removes leftover copies from \`C:\\Program Files\\obs-studio\\\` and from the old ProgramData \`bin\\64bit\` layout. A portable OBS copy in a custom folder is not removed."
            echo
            echo "## Downloads"
            echo
            echo "- **Installer** (\`*-windows-x64.exe\`) — recommended"
            echo "- **Portable zip** (\`*-windows-x64.zip\`) — copy the \`vertical-hud-mask\` folder into \`%ProgramData%\\obs-studio\\plugins\\\`, or into the \`plugins\` folder next to portable OBS's \`bin\`"
            echo "- **Source** (\`*-source.zip\`)"
            echo
            echo "### Checksums"
            echo
            for file in ${{ github.workspace }}/@(*.exe|*.zip); do
              echo "- \`${file##*/}\`: \`$(sha256sum "${file}" | cut -d " " -f 1)\`"
            done
          } > ${{ github.workspace }}/CHECKSUMS.txt

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: false
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          fail_on_unmatched_files: true
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
